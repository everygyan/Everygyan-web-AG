      <stop offset="0%" stop-color="#1A1F1E" />
      <stop offset="100%" stop-color="#2D3A36" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07858" />
      <stop offset="100%" stop-color="#C86446" />
